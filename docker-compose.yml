version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=file:./db/custom.db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - PORT=8000
      - NODE_ENV=production
    volumes:
      - db-data:/app/db
    restart: always

volumes:
  db-data:
